name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: sk-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w backend
      - run: npm exec -w backend prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker build --target production -t ai-incident-intelligence:ci .
